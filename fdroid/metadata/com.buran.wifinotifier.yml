# Metadata for the F-Droid build recipe.
#
# The canonical copy of this file lives in the project repository; the same
# content is what a merge request to fdroiddata
# (metadata/com.buran.wifinotifier.yml) would carry, and what the local
# fdroidserver workdir indexes the self-hosted repository from.
#
# The build runs on F-Droid's own server, where keystore.properties does not
# exist, so the release APK comes out unsigned and they sign it themselves.

Categories:
  - Connectivity
  - System

License: MIT
AuthorName: Andrew Burdyug

SourceCode: https://github.com/1buran/wifi-notifier
IssueTracker: https://github.com/1buran/wifi-notifier/issues

RepoType: git
Repo: https://github.com/1buran/wifi-notifier

Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: v1.0.1
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.1
CurrentVersionCode: 2

# There is no metadata field for the listing: fdroidserver picks up
# fastlane/metadata/android/<locale>/ from the source tree by itself.
